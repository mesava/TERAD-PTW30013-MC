name: Stage 2 PTW30013 geometry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage2-ptw30013-geometry.yml'
      - 'data/ptw30013_modelA.json'
      - 'scripts/validate_ptw30013_modelA.py'
      - 'inputs/stage2_ptw30013_modelA_q120_smoke.egsinp'
      - 'inputs/stage2_ptw30013_modelA_q120_xcse.egsinp'
      - 'scripts/generate_spekpy_spectra.py'
      - 'data/beam_qualities.csv'
      - 'docs/PTW30013_GEOMETRY_STAGE2.md'

jobs:
  validate-build-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      EGSRUN: /tmp/EGSnrc

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate Model A analytic geometry
        run: |
          python scripts/validate_ptw30013_modelA.py | tee stage2_geometry_validation.log

      - name: Set up Python for Stage 1 spectrum regeneration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate accepted TERAD spectra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'spekpy==2.5.4' 'scipy>=1.10'
          set -o pipefail
          python scripts/generate_spekpy_spectra.py 2>&1 | tee stage2_spekpy.log
          test -s spectra/Q120.ensrc

      - name: Install EGSnrc prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ gfortran make tk grace libmotif-dev expect qtbase5-dev

      - name: Clone pinned EGSnrc 2026 release
        run: |
          rm -rf "$EGSRUN"
          git clone https://github.com/nrc-cnrc/EGSnrc.git "$EGSRUN"
          cd "$EGSRUN"
          git checkout f4d029f625a6c96ef3456e0b6d91d46ffce613e7
          test "$(git rev-parse HEAD)" = "f4d029f625a6c96ef3456e0b6d91d46ffce613e7"

      - name: Configure EGSnrc
        shell: bash
        run: |
          cd "$EGSRUN"
          export USER=runner
          export EGS_BASE="$PWD"
          set -o pipefail
          ./HEN_HOUSE/scripts/configure.expect gha.conf 3 2>&1 | tee "$GITHUB_WORKSPACE/stage2_configure.log"

      - name: Build egs_chamber
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"
          cd "$EGS_HOME/egs_chamber"
          set -o pipefail
          make 2>&1 | tee "$GITHUB_WORKSPACE/stage2_egs_chamber_build.log"
          test -x "$EGS_HOME/bin/gha/egs_chamber"

      - name: Run PTW30013 Model A Q120 XCSE diagnostic
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"

          cp "$GITHUB_WORKSPACE/inputs/stage2_ptw30013_modelA_q120_xcse.egsinp" "$EGS_HOME/egs_chamber/stage2_modelA_q120_xcse.egsinp"
          cp "$GITHUB_WORKSPACE/spectra/Q120.ensrc" "$EGS_HOME/egs_chamber/Q120.ensrc"

          cd "$EGS_HOME/egs_chamber"
          set -o pipefail
          "$EGS_HOME/bin/gha/egs_chamber" -i stage2_modelA_q120_xcse -p 521icru 2>&1 | tee "$GITHUB_WORKSPACE/stage2_modelA_q120_xcse.log"

      - name: Validate XCSE cavity-scoring diagnostic
        shell: bash
        run: |
          test -s stage2_modelA_q120_xcse.log

          if grep -Eqi 'segmentation fault|fatal error|geometry error|missing/wrong .cavity geometry.' stage2_modelA_q120_xcse.log; then
            echo 'Stage 2 log contains a fatal/geometry diagnostic.'
            grep -Ein 'segmentation fault|fatal error|geometry error|missing/wrong .cavity geometry.' stage2_modelA_q120_xcse.log || true
            exit 1
          fi

          # These warnings mean the per-geometry XCSE configuration was not
          # parsed, so a nominally successful transport run is not acceptable.
          if grep -Eqi "missing/wrong 'enhance regions'|missing/wrong 'enhancement'|number of 'enhance regions' must match" stage2_modelA_q120_xcse.log; then
            echo 'Stage 2 XCSE scoring configuration was not accepted.'
            grep -Ein "enhance regions|enhancement" stage2_modelA_q120_xcse.log || true
            exit 1
          fi

          # Require the global egs_chamber XCSE switch to be truly active.
          grep -Eq 'photon cross-section enhancement[[:space:]]*=[[:space:]]*On' stage2_modelA_q120_xcse.log
          grep -Eq 'Global Pcut[[:space:]]+0\.01' stage2_modelA_q120_xcse.log
          grep -Eq 'Global Ecut[[:space:]]+0\.521' stage2_modelA_q120_xcse.log

          echo '===== dose-related output ====='
          grep -Ei 'dose|cavity|history|histories|enhancement' stage2_modelA_q120_xcse.log | tail -n 120 || true

          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('stage2_modelA_q120_xcse.log').read_text(errors='replace')
          m = re.search(r'ptw30013_modelA_in_water\s+([0-9.+\-Ee]+)\s+\+/-\s*([0-9.+\-Ee]+)%', text)
          if not m:
              raise SystemExit('Could not parse PTW30013 cavity dose from XCSE diagnostic.')
          dose = float(m.group(1))
          unc = float(m.group(2))
          print(f'Parsed PTW30013 cavity dose: {dose:.8e}')
          print(f'Parsed statistical uncertainty: {unc:.3f} %')
          if not dose > 0.0:
              raise SystemExit('PTW30013 cavity dose is not positive; Stage 2 is not validated.')
          if not unc < 100.0:
              raise SystemExit('PTW30013 cavity score has no useful events; Stage 2 is not validated.')
          PY

          echo 'Stage 2 PTW30013 Model A cavity scoring validated with XCSE.'

      - name: Upload Stage 2 diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-ptw30013-modelA
          path: |
            stage2_geometry_validation.log
            stage2_spekpy.log
            stage2_configure.log
            stage2_egs_chamber_build.log
            stage2_modelA_q120_xcse.log
            results/spekpy_fit_summary.csv
            spectra/Q120.ensrc
          if-no-files-found: warn
