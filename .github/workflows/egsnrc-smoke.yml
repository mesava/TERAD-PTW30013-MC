name: EGSnrc smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/egsnrc-smoke.yml'
      - 'ci/**'

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      EGSRUN: /tmp/EGSnrc

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install official EGSnrc devcontainer prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ gfortran make tk grace libmotif-dev expect qtbase5-dev

      - name: Clone pinned EGSnrc 2026 release commit into short path
        run: |
          rm -rf "$EGSRUN"
          git clone https://github.com/nrc-cnrc/EGSnrc.git "$EGSRUN"
          cd "$EGSRUN"
          git checkout f4d029f625a6c96ef3456e0b6d91d46ffce613e7
          git rev-parse HEAD
          echo "EGSnrc path length: ${#PWD} chars"

      - name: Configure EGSnrc non-interactively
        id: configure
        shell: bash
        run: |
          cd "$EGSRUN"
          export USER=runner
          export EGS_BASE="$PWD"

          set +e
          ./HEN_HOUSE/scripts/configure.expect gha.conf 3 2>&1 | tee "$GITHUB_WORKSPACE/configure_stdout.log"
          cfg_status=${PIPESTATUS[0]}
          set -e

          mkdir -p "$GITHUB_WORKSPACE/egsnrc-config-logs"
          cp -f HEN_HOUSE/scripts/configure.log "$GITHUB_WORKSPACE/egsnrc-config-logs/configure.log" 2>/dev/null || true
          cp -f HEN_HOUSE/log/*.log "$GITHUB_WORKSPACE/egsnrc-config-logs/" 2>/dev/null || true
          cp -f HEN_HOUSE/lib/gha/machine.macros "$GITHUB_WORKSPACE/egsnrc-config-logs/machine.macros" 2>/dev/null || true
          cp -f HEN_HOUSE/pegs4/pegs4_gha.mortlst "$GITHUB_WORKSPACE/egsnrc-config-logs/pegs4_gha.mortlst" 2>/dev/null || true
          cp -f HEN_HOUSE/pegs4/mortjob.mortran "$GITHUB_WORKSPACE/egsnrc-config-logs/mortjob.mortran" 2>/dev/null || true

          echo "===== configure.log ====="
          cat HEN_HOUSE/scripts/configure.log 2>/dev/null || true
          echo "===== machine.macros ====="
          nl -ba HEN_HOUSE/lib/gha/machine.macros 2>/dev/null || true
          echo "===== pegs4 mortlst tail ====="
          tail -n 120 HEN_HOUSE/pegs4/pegs4_gha.mortlst 2>/dev/null || true

          if [ "$cfg_status" -ne 0 ]; then
            echo "EGSnrc configuration failed with exit code $cfg_status"
            exit "$cfg_status"
          fi

          echo "EGS_HOME=$PWD/egs_home/" >> "$GITHUB_ENV"
          echo "EGS_CONFIG=$PWD/HEN_HOUSE/specs/gha.conf" >> "$GITHUB_ENV"
          echo "HEN_HOUSE=$PWD/HEN_HOUSE/" >> "$GITHUB_ENV"

      - name: Upload configuration diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egsnrc-config-diagnostics
          path: |
            configure_stdout.log
            egsnrc-config-logs/**
          if-no-files-found: warn

      - name: Build egs_chamber
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"

          echo "EGS_HOME=$EGS_HOME"
          echo "EGS_CONFIG=$EGS_CONFIG"
          echo "HEN_HOUSE=$HEN_HOUSE"
          test -d "$EGS_HOME/egs_chamber"
          ls -la "$EGS_HOME/egs_chamber" | head -n 40
          cd "$EGS_HOME/egs_chamber"
          echo "Building from $(pwd)"
          set -o pipefail
          make 2>&1 | tee "$GITHUB_WORKSPACE/egs_chamber_build.log"
          echo "===== built executables ====="
          ls -la "$EGS_HOME/bin/gha" || true

      - name: Run official egs_chamber smoke example
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"

          cd "$EGS_HOME/egs_chamber"
          cp example2_chamber_dd.egsinp smoke.egsinp
          sed -i 's/ncase = 100000/ncase = 1000/' smoke.egsinp
          test -x "$EGS_HOME/bin/gha/egs_chamber"
          set -o pipefail
          "$EGS_HOME/bin/gha/egs_chamber" -i smoke -p 521icru 2>&1 | tee "$GITHUB_WORKSPACE/egs_chamber_smoke.log"

      - name: Upload build and smoke logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egsnrc-smoke-logs
          path: |
            egs_chamber_build.log
            egs_chamber_smoke.log
          if-no-files-found: warn
