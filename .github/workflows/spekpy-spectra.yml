name: TERAD SpekPy spectra (legacy manual)

# The original Stage 1 positive-equivalent-Al model is no longer accepted for
# production after the authoritative TERAD HVL baseline was corrected.
# Keep this workflow only as a manual audit/reproduction tool for the legacy
# model. Automatic baseline validation is handled by
# terad-stage1-baseline-diagnostic.yml.

on:
  workflow_dispatch:

jobs:
  legacy-generate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Explain legacy status
        run: |
          echo 'LEGACY WORKFLOW ONLY.'
          echo 'The corrected TERAD baseline makes the old positive-Al fit non-representative for Q120/Q140/Q200.'
          echo 'A failure of generate_spekpy_spectra.py against current beam_qualities.csv is expected and must not be treated as a production CI failure.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SpekPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'spekpy==2.5.4' 'scipy>=1.10'

      - name: Reproduce legacy fitter against current baseline
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/generate_spekpy_spectra.py 2>&1 | tee spekpy_stage1_legacy.log

      - name: Upload legacy diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terad-spekpy-stage1-legacy-manual
          path: |
            spekpy_stage1_legacy.log
            data/beam_qualities.csv
            docs/SPECTRUM_MODEL_STAGE1.md
          if-no-files-found: warn
