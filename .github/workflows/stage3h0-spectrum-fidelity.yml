name: Stage 3H-0 spectrum fidelity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stage3h0_spectrum_fidelity.py'
      - 'data/czarnecki2020_spectrum_parameters.csv'
      - '.github/workflows/stage3h0-spectrum-fidelity.yml'

jobs:
  fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'spekpy==2.5.4' 'numpy>=1.26' 'scipy>=1.10'

      - name: Run Stage 3H-0 spectrum fidelity
        shell: bash
        run: |
          set -o pipefail
          python scripts/stage3h0_spectrum_fidelity.py 2>&1 | tee stage3h0_spectrum_fidelity.log
          test -s results/stage3h0_spectrum_fidelity.csv
          cat results/stage3h0_spectrum_fidelity.csv

      - name: Upload Stage 3H-0 results
        uses: actions/upload-artifact@v4
        with:
          name: stage3h0-spectrum-fidelity
          path: |
            stage3h0_spectrum_fidelity.log
            results/stage3h0_spectrum_fidelity.csv
          if-no-files-found: error
