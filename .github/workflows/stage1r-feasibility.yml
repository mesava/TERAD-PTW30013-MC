name: Stage 1R TERAD spectrum feasibility

on:
  push:
    paths:
      - '.github/workflows/stage1r-feasibility.yml'
      - 'scripts/stage1r_feasibility_scan.py'
      - 'data/terad_input_baseline.csv'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SpekPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'spekpy==2.5.4' 'scipy>=1.10'
      - name: Run Stage 1R feasibility scan
        shell: bash
        run: |
          set -o pipefail
          python scripts/stage1r_feasibility_scan.py | tee stage1r_feasibility.log
      - name: Validate outputs
        run: |
          test -s results/stage1r_feasibility_scan.csv
          test -s results/stage1r_feasibility_summary.txt
          cat results/stage1r_feasibility_summary.txt
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('results/stage1r_feasibility_scan.csv')))
          assert len(rows)==108, len(rows)
          assert {r['beam_id'] for r in rows}=={'Q120','Q140','Q150','Q200'}
          assert not any(r['status']=='engine_error' for r in rows), 'At least one spectrum engine/angle failed'
          print('Stage 1R feasibility matrix complete:', len(rows), 'cases')
          PY
      - name: Upload Stage 1R feasibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1r-terad-feasibility
          path: |
            results/stage1r_feasibility_scan.csv
            results/stage1r_feasibility_summary.txt
            stage1r_feasibility.log
            data/terad_input_baseline.csv
          if-no-files-found: error
