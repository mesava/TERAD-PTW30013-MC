name: Stage 3C benchmark high-stat validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage3c-benchmark-highstat.yml'

jobs:
  high-stat:
    name: ${{ matrix.beam }} / 200M / XCSE64 RR64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - beam: CCRI100
            seed1: '33'
            seed2: '97'
          - beam: CCRI250
            seed1: '1802'
            seed2: '4000'
    env:
      EGSRUN: /tmp/EGSnrc
      NCASE: '200000000'
      NBATCH: '20'
      BEAM: ${{ matrix.beam }}
      XCSE: '64'
      RR: '64'
      SEED1: ${{ matrix.seed1 }}
      SEED2: ${{ matrix.seed2 }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Czarnecki HVL-matched spectra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'spekpy==2.5.4' 'scipy>=1.10'
          set -o pipefail
          python scripts/generate_czarnecki_benchmark_spectra.py 2>&1 | tee stage3c_spectra.log
          test -s "spectra/benchmark_czarnecki2020/${BEAM}.ensrc"

      - name: Install EGSnrc prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y git gcc g++ gfortran make tk grace libmotif-dev expect qtbase5-dev

      - name: Clone pinned EGSnrc 2026 release
        run: |
          rm -rf "$EGSRUN"
          git clone https://github.com/nrc-cnrc/EGSnrc.git "$EGSRUN"
          cd "$EGSRUN"
          git checkout f4d029f625a6c96ef3456e0b6d91d46ffce613e7
          test "$(git rev-parse HEAD)" = "f4d029f625a6c96ef3456e0b6d91d46ffce613e7"

      - name: Configure EGSnrc
        shell: bash
        run: |
          cd "$EGSRUN"
          export USER=runner
          export EGS_BASE="$PWD"
          set -o pipefail
          ./HEN_HOUSE/scripts/configure.expect gha.conf 3 2>&1 | tee "$GITHUB_WORKSPACE/stage3c_configure.log"

      - name: Build egs_chamber with radiative Compton support
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"
          cd "$EGS_HOME/egs_chamber"
          python - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          text = p.read_text()
          old = 'CPP_SOURCES = $(C_ADVANCED_SOURCES)'
          new = ('CPP_SOURCES = $(subst $(EGS_SOURCEDIR)get_inputs.mortran,'
                 '$(EGS_SOURCEDIR)rad_compton1.mortran '
                 '$(EGS_SOURCEDIR)get_inputs.mortran,$(C_ADVANCED_SOURCES))')
          if old not in text:
              raise SystemExit('Could not patch egs_chamber Makefile for rad_compton1.mortran')
          p.write_text(text.replace(old, new, 1))
          PY
          set -o pipefail
          make 2>&1 | tee "$GITHUB_WORKSPACE/stage3c_egs_chamber_build.log"
          test -x "$EGS_HOME/bin/gha/egs_chamber"

      - name: Run Stage 3C high-stat matrix point
        shell: bash
        run: |
          export EGS_HOME="$EGSRUN/egs_home/"
          export EGS_CONFIG="$EGSRUN/HEN_HOUSE/specs/gha.conf"
          export HEN_HOUSE="$EGSRUN/HEN_HOUSE/"
          export PATH="$HEN_HOUSE/scripts/bin:$HEN_HOUSE/bin/gha:$EGS_HOME/bin/gha:$PATH"
          cp "spectra/benchmark_czarnecki2020/${BEAM}.ensrc" "$EGS_HOME/egs_chamber/${BEAM}.ensrc"
          mkdir -p stage3c_logs
          name="stage3c_${BEAM}_x${XCSE}_rr${RR}_n200m"
          sed \
            -e "s/@@BEAM@@/${BEAM}/g" \
            -e "s/@@XCSE@@/${XCSE}/g" \
            -e "s/@@RR@@/${RR}/g" \
            -e "s/@@NCASE@@/${NCASE}/g" \
            inputs/stage3b_czarnecki_modelA_vrt.template.egsinp > "$EGS_HOME/egs_chamber/${name}.egsinp"

          python - "$EGS_HOME/egs_chamber/${name}.egsinp" <<'PY'
          from pathlib import Path
          import os, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          text = text.replace('nbatch = 10', f"nbatch = {os.environ['NBATCH']}", 1)
          rng = (
              ':start rng definition:\n'
              '    type = ranmar\n'
              f"    initial seeds = {os.environ['SEED1']} {os.environ['SEED2']}\n"
              ':stop rng definition:\n\n'
          )
          marker = ':start run control:'
          if marker not in text:
              raise SystemExit('Could not insert RNG definition before run control')
          text = text.replace(marker, rng + marker, 1)
          p.write_text(text)
          PY

          cd "$EGS_HOME/egs_chamber"
          echo "===== ${name} ====="
          set -o pipefail
          "$EGS_HOME/bin/gha/egs_chamber" -i "$name" 2>&1 | tee "$GITHUB_WORKSPACE/stage3c_logs/${name}.log"
          cd "$GITHUB_WORKSPACE"

          log="stage3c_logs/${name}.log"
          grep -Eq 'Global Pcut[[:space:]]+0\.001' "$log"
          grep -Eq 'Global Ecut[[:space:]]+0\.512' "$log"
          grep -Eq 'Radiative Compton corrections[[:space:]]+On' "$log"
          grep -Eq 'photon cross-section enhancement[[:space:]]*=[[:space:]]*On' "$log"
          grep -Fq 'Range rejection = Russian Roullette (RR)' "$log"
          grep -Fq 'else RR with survival probability 0.015625' "$log"
          grep -Fq "scoring phase-space at cavity of 'phsp_scoring_geometry'" "$log"
          grep -Fq '1) phsp_scoring_geometry -> phsp_box' "$log"
          grep -Fq '2) dose_to_water -> water_score_voxel' "$log"
          grep -Fq '3) chamber_in_water -> ptw30013_cavity_envelope' "$log"
          grep -Eq "initial seeds[[:space:]]*=[[:space:]]*${SEED1}[[:space:]]+${SEED2}" "$log"
          grep -Eq "Fresh simulation of[[:space:]]+${NCASE}[[:space:]]+histories" "$log"
          grep -Eq "last case[[:space:]]*=[[:space:]]*${NCASE}" "$log"
          grep -Eq 'finishSimulation\(egs_chamber\)[[:space:]]+0' "$log"

          python - "$log" "$XCSE" <<'PY'
          from pathlib import Path
          import re, sys
          log_path = Path(sys.argv[1])
          xcse = sys.argv[2]
          text = log_path.read_text(errors='replace')
          allowed_missing = {
              "initScoring: missing/wrong 'sub geometries'  for geometry 'phsp_scoring_geometry'",
              "initScoring: missing/wrong 'sub geometries'  for geometry 'dose_to_water'",
              "initScoring: missing/wrong 'sub geometries'  for geometry 'chamber_in_water'",
          }
          unexpected = [line.strip() for line in text.splitlines()
                        if 'missing/wrong' in line and line.strip() not in allowed_missing]
          if unexpected:
              raise SystemExit('Unexpected missing/wrong diagnostic(s): ' + ' | '.join(unexpected))

          def validate_xcse_block(name, expected_regions):
              match = re.search(
                  rf'\d+\)\s+{re.escape(name)}\s*\n\s*regions\s*:\s*([^\n]*)\n\s*enhancement:\s*([^\n]*)',
                  text,
              )
              if not match:
                  raise SystemExit(f'Missing XCSE diagnostic block for {name}')
              regions = [int(v) for v in match.group(1).split()]
              factors = match.group(2).split()
              if regions != expected_regions:
                  raise SystemExit(f'{name}: XCSE regions {regions} != expected {expected_regions}')
              if len(factors) != len(expected_regions):
                  raise SystemExit(f'{name}: {len(factors)} XCSE factors for {len(expected_regions)} regions')
              if any(v != xcse for v in factors):
                  raise SystemExit(f'{name}: XCSE factors {factors} do not all equal {xcse}')
              print(f'{name}: validated {len(regions)} XCSE regions, all factor={xcse}')

          validate_xcse_block('dose_to_water', [1, 3, 4, 5])
          validate_xcse_block('chamber_in_water', [1, 6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17, 18, 19, 21])
          PY

          if grep -Eqi 'segmentation fault|fatal error|geometry error|Turning radiative Compton corrections OFF' "$log"; then
            echo "Fatal Stage 3C diagnostic in ${name}"
            grep -Ein 'segmentation fault|fatal error|geometry error|Turning radiative Compton corrections OFF|radiative Compton' "$log" || true
            exit 1
          fi

          grep -Eq 'dose_to_water[[:space:]]+chamber_in_water[[:space:]]+-[[:space:]]+[0-9.+Ee-]+[[:space:]]+\+/-[[:space:]]*[0-9.+Ee-]+' "$log"
          echo "--- VRT/dose/ratio tail: ${name} ---"
          grep -Ei 'phase.?space|Russian|Roulette|range rejection|survival|enhancement|cavity dose|dose ratio|dose_to_water|chamber_in_water|uncertainty|initial seeds' "$log" | tail -n 120 || true

      - name: Summarize Stage 3C matrix point
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          beam = os.environ['BEAM']; x = os.environ['XCSE']; rr = os.environ['RR']; ncase = os.environ['NCASE']
          p = Path(f'stage3c_logs/stage3c_{beam}_x{x}_rr{rr}_n200m.log')
          out = Path(f'stage3c_{beam}_summary.csv')
          cols = ['beam','xcse','rr','ncase','seed1','seed2','water_dose','water_unc_pct','chamber_dose','chamber_unc_pct','ratio','ratio_unc_abs','ratio_unc_pct','elapsed_s']
          if not p.exists():
              row = [beam,x,rr,ncase,os.environ['SEED1'],os.environ['SEED2']] + ['NA']*8
              out.write_text(','.join(cols)+'\n'+','.join(row)+'\n')
              print(out.read_text()); raise SystemExit(0)
          text = p.read_text(errors='replace')
          def dose(name):
              ms = re.findall(rf'^{name}\s+([0-9.+\-Ee]+)\s+\+/-\s*([0-9.+\-Ee]+)\s*%', text, re.M)
              return ms[-1] if ms else ('NA','NA')
          wd, wu = dose('dose_to_water'); cd, cu = dose('chamber_in_water')
          mr = re.findall(r'^dose_to_water\s+chamber_in_water\s+-\s+([0-9.+\-Ee]+)\s+\+/-\s*([0-9.+\-Ee]+)', text, re.M)
          if mr:
              r, ur = map(float, mr[-1]); rup = 100.0*ur/r
              rs, urs, rups = f'{r:.8g}', f'{ur:.8g}', f'{rup:.5f}'
          else:
              rs=urs=rups='NA'
          me = re.findall(r'Elapsed time:\s+([0-9.+\-Ee]+)\s+s', text)
          elapsed = me[-1] if me else 'NA'
          row = [beam,x,rr,ncase,os.environ['SEED1'],os.environ['SEED2'],wd,wu,cd,cu,rs,urs,rups,elapsed]
          out.write_text(','.join(cols)+'\n'+','.join(row)+'\n')
          print(out.read_text())
          PY

      - name: Upload Stage 3C diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3c-${{ matrix.beam }}-x64-rr64-n200m
          path: |
            stage3c_spectra.log
            stage3c_configure.log
            stage3c_egs_chamber_build.log
            stage3c_logs/*.log
            stage3c_${{ matrix.beam }}_summary.csv
            results/czarnecki_spectrum_summary.csv
            spectra/benchmark_czarnecki2020/${{ matrix.beam }}.ensrc
            spectra/benchmark_czarnecki2020/${{ matrix.beam }}_spekpy.csv
          if-no-files-found: warn

  benchmark-summary:
    name: Evaluate k100,250 benchmark
    needs: high-stat
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Stage 3C point summaries
        uses: actions/download-artifact@v4
        with:
          pattern: stage3c-*-x64-rr64-n200m
          path: stage3c_downloads
          merge-multiple: true

      - name: Calculate benchmark ratio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, math

          rows = {}
          for p in Path('stage3c_downloads').glob('stage3c_*_summary.csv'):
              with p.open(newline='') as f:
                  row = next(csv.DictReader(f))
              rows[row['beam']] = row

          missing = {'CCRI100','CCRI250'} - set(rows)
          if missing:
              raise SystemExit('Missing Stage 3C summary for: ' + ', '.join(sorted(missing)))

          def vals(beam):
              r = float(rows[beam]['ratio'])
              ur = float(rows[beam]['ratio_unc_abs'])
              return r, ur

          r100, u100 = vals('CCRI100')
          r250, u250 = vals('CCRI250')
          k = r100 / r250
          uk_rel = math.sqrt((u100/r100)**2 + (u250/r250)**2)
          uk = k * uk_rel
          pub_enea = 0.9537
          pub_thm = 0.9534
          d_enea = 100.0*(k/pub_enea - 1.0)
          d_thm = 100.0*(k/pub_thm - 1.0)
          target = (100.0*u100/r100 <= 1.0) and (100.0*u250/r250 <= 1.0)

          out = Path('stage3c_benchmark_summary.csv')
          header = ['R100','uR100_abs','uR100_pct','R250','uR250_abs','uR250_pct','k100_250_mc','uk_abs','uk_pct','published_enea','delta_enea_pct','published_thm','delta_thm_pct','rq_uncertainty_target_le_1pct']
          values = [
              f'{r100:.8g}', f'{u100:.8g}', f'{100*u100/r100:.5f}',
              f'{r250:.8g}', f'{u250:.8g}', f'{100*u250/r250:.5f}',
              f'{k:.8g}', f'{uk:.8g}', f'{100*uk_rel:.5f}',
              f'{pub_enea:.4f}', f'{d_enea:.5f}', f'{pub_thm:.4f}', f'{d_thm:.5f}',
              'YES' if target else 'NO'
          ]
          out.write_text(','.join(header)+'\n'+','.join(values)+'\n')
          print(out.read_text())

          summary = Path('stage3c_benchmark_summary.md')
          summary.write_text(
              '# Stage 3C high-stat benchmark\n\n'
              f'- R100 = {r100:.6f} ± {u100:.6f} ({100*u100/r100:.3f}%)\n'
              f'- R250 = {r250:.6f} ± {u250:.6f} ({100*u250/r250:.3f}%)\n'
              f'- k100,250(MC) = {k:.6f} ± {uk:.6f} ({100*uk_rel:.3f}%)\n'
              f'- vs ENEA 0.9537: {d_enea:+.3f}%\n'
              f'- vs THM 0.9534: {d_thm:+.3f}%\n'
              f'- Each RQ <=1% MC uncertainty: {"YES" if target else "NO"}\n'
          )
          print(summary.read_text())
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write(summary.read_text())
          PY

      - name: Upload Stage 3C benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-benchmark-summary
          path: |
            stage3c_benchmark_summary.csv
            stage3c_benchmark_summary.md
